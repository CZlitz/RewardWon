<style>
@font-face{
  font-family:'Burbank Big Condensed';
  src:url('./burbankbigcondensed_black.otf') format('opentype');
  font-style:normal;
  font-weight:900;
  font-display:block;
}

:root{
  --bg:#121019;
  --panel:#1c1726;
  --fg:#efeaf6;
  --muted:#a299b3;
  --line:#383145;
  --accent:#f2b933;
  --accent-fg:#1b1405;

  --display:'Burbank Big Condensed','Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --body:'Barlow',system-ui,sans-serif;

  color-scheme:dark;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--fg);
  font-family:var(--body);
  font-size:15px;
  line-height:1.5;
  user-select:none;
  -webkit-user-select:none;
}

.wrap{
  max-width:1240px;
  margin:0 auto;
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;
  justify-content:center;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px 16px;
  box-shadow:0 4px 18px rgba(0,0,0,0.35);
}

button{
  font:600 14px var(--body);
  color:var(--fg);
  background:#262033;
  border:1px solid var(--line);
  border-radius:6px;
  padding:8px 15px;
  min-height:38px;
  cursor:pointer;
  transition:background .15s ease, transform .1s ease;
}

button:hover{ background:#342c45; }
button:active{ transform:scale(0.97); }

button.primary{
  background:var(--accent);
  color:var(--accent-fg);
  border-color:var(--accent);
  font-weight:700;
}

button.primary:hover{ background:#ffd04a; }

button:focus-visible{
  outline:3px solid var(--accent);
  outline-offset:2px;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.backgrounds{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:9px;
  padding-left:10px;
  border-left:1px solid var(--line);
  color:var(--muted);
  font-size:13px;
}

.backgrounds label{
  display:flex;
  align-items:center;
  gap:6px;
}

.backgrounds input[type="color"]{
  width:35px;
  height:32px;
  padding:2px;
  background:#262033;
  border:1px solid var(--line);
  border-radius:6px;
  cursor:pointer;
}

.backgrounds input[type="text"]{
  width:82px;
  min-height:32px;
  padding:5px 7px;
  color:var(--fg);
  background:#262033;
  border:1px solid var(--line);
  border-radius:6px;
  font:12px monospace;
  text-transform:uppercase;
}

.backgrounds select{
  min-height:32px;
  padding:5px 8px;
  color:var(--fg);
  background:#262033;
  border:1px solid var(--line);
  border-radius:6px;
  font:12px var(--body);
  cursor:pointer;
}

.shortcut-hint{
  font-size:12px;
  color:var(--muted);
  margin-left:8px;
}

.shortcut-hint kbd{
  background:#2e283d;
  border:1px solid var(--line);
  padding:2px 6px;
  border-radius:4px;
  color:var(--fg);
}

/* Área de visualização (16:9) */
#view{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  overflow:hidden;
  border-radius:10px;
  background:radial-gradient(120% 90% at 50% 40%, #2b2350 0%, #16122b 55%, #0b0918 100%);
  border:1px solid var(--line);
  box-shadow:0 8px 32px rgba(0,0,0,0.5);
}

#view:fullscreen{
  width:100vw;
  height:100vh;
  aspect-ratio:auto;
  border:0;
  border-radius:0;
}

/* Palco 1920x1080 */
#stage{
  position:absolute;
  left:50%;
  top:50%;
  width:1920px;
  height:1080px;
  transform-origin:center center;
  pointer-events:none;
}

#stage *{
  position:absolute;
  box-sizing:border-box;
}

/*
  Overlay_Root: SizeBox_0 (MaxDesiredWidth 672) x GodRays 800 de altura.
*/
#ov{
  width:672px;
  height:800px;
  left:624px;
  top:0;
}

/* Image_GodRays */
#raysCanvas{
  left:-624px;
  top:0;
  width:1920px;
  height:800px;
  opacity:0;
}

/* Text_BigPrize */
#big{
  left:336px;
  top:0;
  width:0;
  height:0;
  opacity:0;
}

#bigTxt{
  left:0;
  top:0;

  font-style:italic;
  text-transform:uppercase;
  white-space:nowrap;

}

/* VBox_Reward */
#vbox{
  left:0;
  top:0;

  height:800px;

/* OverlayPrize */

#bg{

#bg svg{

#bg .plateImg{

  top:0;
  width:200px;
  height:200px;
  background-position:center;
  background-size:contain;
  background-repeat:no-repeat;
}

/* Image_Circles */
#circ{
  left:0;
  top:0;
  width:200px;
  height:200px;

  opacity:0;
}

#circ i{
  display:block;

  height:200px;

}

#cRing{
  border:4px solid #ffe36a;
  box-shadow:0 0 16px rgba(255,170,30,.9);
}

#cFlare{ border-radius:0 !important; }

#cFlare:before,#cFlare:after{
  content:"";
  left:0;
  right:0;
  top:50%;
  height:4px;
  background:linear-gradient(90deg,transparent,#fff0a0,transparent);
  transform:translateY(-50%);
}

#cFlare:after{
  transform:translateY(-50%) rotate(90deg);
}

/* Image_Reward */
#reward{
  left:50%;
  top:50%;
  height:120px;
  width:auto;
  display:block;
  opacity:0;
  filter:drop-shadow(0 8px 14px rgba(0,0,0,.55));
}

/* HorizontalBox_2 */
#row{
  left:336px;
  top:190px;
  width:0;
  height:0;
}

/* Image_LeftSide / Image_RightSide */
.side{
  width:350px;
  height:80px;
  top:-40px;
  left:-175px;
}

.side .lines{
  left:0;
  top:0;
  width:350px;
  height:80px;
}

.side i{
  display:block;
  left:0;
  width:350px;
  transform-origin:0 50%;

.side i.big{

.side i.small{

  background:#F2CA3E;
  box-shadow:0 0 10px rgba(242,202,62,0.9);

/* Border_Brackets */
#brk{
  left:0;
  top:-39.5px;
  height:79px;
  width:0;
  opacity:0;
}

#centerGlow{
  left:0;
  top:6px;
  height:67px;

  border-radius:50%;
  pointer-events:none;

.brkSvg{
  top:0;
  width:30px;
  height:79px;
  overflow:visible;

/* Textos */
.txt{
  left:0;
  top:0;
  white-space:nowrap;
  text-transform:uppercase;
  text-align:center;
  letter-spacing:0;

#won{

#name{

  color:#fff469;
  text-shadow:0 2px 3px rgba(0,0,0,0.35);
}

@media(max-width:600px){
  .wrap{padding:8px}
  .toolbar{gap:6px;padding:8px}
  .backgrounds{padding-left:4px}
  .shortcut-hint{display:none}
}
</style>

  var cur = SUP;

  function tan(k,i){
    var n = k.length;
    if(i <= 0 || i >= n-1) return 0;

    var a = (k[i][1]-k[i-1][1])/(k[i][0]-k[i-1][0]);
    var b = (k[i+1][1]-k[i][1])/(k[i+1][0]-k[i][0]);

    if(a*b <= 0) return 0;

    return 2*a*b/(a+b);
  }

  function ev(k,t){
    if(!k || !k.length) return 0;
    if(t <= k[0][0]) return k[0][1];

    var n = k.length;

    if(t >= k[n-1][0]) return k[n-1][1];

    for(var i=1;i<n;i++){
      if(t <= k[i][0]){
        var p0=k[i-1],p1=k[i];
        var dt=p1[0]-p0[0];
        var u=(t-p0[0])/dt;

        var m0=tan(k,i-1)*dt;
        var m1=tan(k,i)*dt;

        var u2=u*u,u3=u2*u;

        return (2*u3-3*u2+1)*p0[1]
          +(u3-2*u2+u)*m0
          +(-2*u3+3*u2)*p1[1]
          +(u3-u2)*m1;
      }
    }

    return k[n-1][1];
  }

    hex=hex.replace('#','');

    if(hex.length===3){
      hex=hex.split('').map(function(c){return c+c;}).join('');
    }

    if(!/^[0-9a-fA-F]{6}$/.test(hex)) return null;

    return {
      r:parseInt(hex.substring(0,2),16),
      g:parseInt(hex.substring(2,4),16),
      b:parseInt(hex.substring(4,6),16)
    };
  }

  function mixColor(rgb,amount){
    return {
      r:Math.round(rgb.r+(255-rgb.r)*amount),
      g:Math.round(rgb.g+(255-rgb.g)*amount),
      b:Math.round(rgb.b+(255-rgb.b)*amount)
    };
  }

  function darkenColor(rgb,amount){
    return {
      r:Math.round(rgb.r*(1-amount)),
      g:Math.round(rgb.g*(1-amount)),
      b:Math.round(rgb.b*(1-amount))
    };
  }

  function rgbString(rgb){
    return 'rgb('+rgb.r+','+rgb.g+','+rgb.b+')';
  }

  function applyBackground(){
    var rgb=hexToRgb(bgColor.value);

    if(!rgb) return;

    var hex='#'+bgColor.value.replace('#','').toUpperCase();
    bgHex.value=hex;

    if(bgMode.value==='solid'){
      view.style.background=hex;
    }else{
      var light=mixColor(rgb,.12);
      var middle=rgb;
      var dark=darkenColor(rgb,.48);

      view.style.background=
        'radial-gradient(120% 90% at 50% 40%, '+
        rgbString(light)+' 0%, '+
        rgbString(middle)+' 55%, '+
        rgbString(dark)+' 100%)';
    }
  }

  bgColor.addEventListener('input',applyBackground);
  bgMode.addEventListener('change',applyBackground);

  bgHex.addEventListener('input',function(){
    var rgb=hexToRgb(bgHex.value);

    if(!rgb) return;

    var hex='#'+bgHex.value.replace('#','');

    bgColor.value=hex;
    applyBackground();
  });

  bgHex.addEventListener('change',function(){
    if(!hexToRgb(bgHex.value)){
      bgHex.value=bgColor.value.toUpperCase();
    }
  });

  applyBackground();

  /* ===================================================================
     Raios dourados + partículas + estilhaços
     =================================================================== */

  var ctx=el.raysCanvas.getContext('2d');
  var R=400;
  var numRays=22;

  var particles=[];

  for(var p=0;p<48;p++){
    particles.push({
      angle:(p/48)*Math.PI*2+(Math.sin(p*3.7)*.4),
      baseDist:40+(p*15.3)%360,
      speed:.25+(p%5)*.15,
      size:2.2+(p%4)*1.6,
      phase:p*1.1
    });
  }

  var shards=[];

  for(var s=0;s<16;s++){
    shards.push({
      angle:(s/16)*Math.PI*2+(Math.cos(s*2.3)*.2),
      speed:140+(s%4)*55,
      rotSpeed:3+(s%3)*2,
      size:14+(s%3)*7,
      color:s%2===0?'#FFBD18':'#FBEA65'
    });
  }

  function renderRays(t,op){
    ctx.clearRect(0,0,1920,800);

    if(op<=.005) return;

    var inten=Math.min(1,ev(cur.rayIntens,t)/2);

    ctx.save();
    ctx.globalAlpha=op;

    var cx=960,cy=400;

    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(t*.12);

    for(var i=0;i<numRays;i++){
      var a0=(i/numRays)*Math.PI*2;
      var a1=a0+(Math.PI/numRays)*.55;

      var grad=ctx.createRadialGradient(0,0,24,0,0,R);

      grad.addColorStop(0,'rgba(255,242,58,'+(.75*(.4+.6*inten))+')');
      grad.addColorStop(.45,'rgba(255,173,0,'+(.45*(.4+.6*inten))+')');
      grad.addColorStop(1,'rgba(255,173,0,0)');

      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.arc(0,0,R,a0,a1);
      ctx.closePath();
      ctx.fillStyle=grad;
      ctx.fill();
    }

    ctx.restore();

    ctx.save();

    for(var j=0;j<particles.length;j++){
      var pt=particles[j];

      var dist=(pt.baseDist+t*pt.speed*70)%R;
      var pAngle=pt.angle+t*.04;

      var px=cx+Math.cos(pAngle)*dist;
      var py=cy+Math.sin(pAngle)*dist;

      var pAlpha=Math.sin((dist/R)*Math.PI)*(.6+.4*Math.sin(t*8+pt.phase));

      if(pAlpha<=0) continue;

      ctx.beginPath();
      ctx.arc(px,py,pt.size,0,Math.PI*2);
      ctx.fillStyle='rgba(255,241,211,'+(pAlpha*op)+')';
      ctx.shadowColor='#FFF1D3';
      ctx.shadowBlur=8;
      ctx.fill();
    }

    ctx.restore();

    if(t>=1.55&&t<=5.0){
      var burstT=t-1.55;

      var burstAlpha=Math.max(
        0,
        Math.min(1,burstT<.4?burstT/.4:(3.45-burstT)/2)
      );

      ctx.save();

      for(var k=0;k<shards.length;k++){
        var sh=shards[k];

        var shDist=burstT*sh.speed;

        var sx=cx+Math.cos(sh.angle)*shDist;
        var sy=cy+Math.sin(sh.angle)*shDist*.8;

        ctx.save();
        ctx.translate(sx,sy);
        ctx.rotate(burstT*sh.rotSpeed);

        ctx.beginPath();
        ctx.moveTo(0,-sh.size);
        ctx.lineTo(sh.size*.6,sh.size*.7);
        ctx.lineTo(-sh.size*.6,sh.size*.7);
        ctx.closePath();

        ctx.fillStyle=sh.color;
        ctx.globalAlpha=burstAlpha*op*.85;
        ctx.shadowColor=sh.color;
        ctx.shadowBlur=10;
        ctx.fill();

        ctx.restore();
      }

      ctx.restore();
    }

    ctx.restore();
  }

  /* ===================================================================
     Render por frame

        'scale('+(core*1.1)+') rotate('+(t*20)+'deg)';

      el.cRays.style.opacity=Math.min(1,rd/2)*.8;

      var rsz=Math.max(ev(a.cRingS,t),.001);
      var th=Math.max(2,Math.min(16,2+(ev(a.cRingT,t)+4)*2.2));

      el.cRing.style.transform='scale('+rsz+')';
      el.cRing.style.borderWidth=(th/Math.max(rsz,.3))+'px';
      el.cRing.style.opacity=ev(a.cRingA,t);

    }

    var rs=ev(a.rewardS,t);

    el.reward.style.opacity=ev(a.rewardOp,t);

    el.reward.style.transform=
      'translate(-50%,-50%) translateY('+ev(a.rewardTy,t)+'px) scale('+rs+')';

    var rr=ev(a.rowS,t);

    el.row.style.transform=
      'translateY('+ev(a.rowTy,t)+'px) scale('+rr+')';

    var nameW=el.name.offsetWidth;

    var borderW=
      (Math.max(nameW,el.won.offsetWidth)+20)*ev(a.brkW,t);

    var sideCx=borderW/2+40+175;

    var fb=Math.max(0,Math.min(1,(ev(a.fillBig,t)+.2)/1.2));
    var fsm=Math.max(0,Math.min(1,(ev(a.fillSmall,t)+.2)/1.2));

    var gl=ev(a.glow,t);
    var sx=ev(a.sSx,t);
    var sy=ev(a.sSy,t);

    var rLines=el.sideR.firstElementChild;
    var lLines=el.sideL.firstElementChild;

    rLines.children[0].style.transform='scaleX('+fb+')';
    rLines.children[1].style.transform='scaleX('+fsm+')';

    lLines.children[0].style.transform='scaleX('+fb+')';
    lLines.children[1].style.transform='scaleX('+fsm+')';

    rLines.style.transform='translateX('+ev(a.hOffR,t)+'px)';
    lLines.style.transform='translateX('+ev(a.hOffL,t)+'px)';

    el.sideR.style.filter=el.sideL.style.filter=
      'drop-shadow(0 '+(6*gl)+'px rgba(253,159,5,.85))';

    el.sideR.style.transform=
      'translate('+(sideCx+ev(a.sRx,t))+'px,0) skewX('+
      ev(a.sRshear,t)+'deg) scale('+sx+','+sy+')';

    el.sideL.style.transform=
      'translate('+(-sideCx+ev(a.sLx,t))+'px,0) skewX('+
      ev(a.sLshear,t)+'deg) scale('+(-sx)+','+sy+')';

    el.brk.style.opacity=ev(a.brkOp,t);

    el.brk.style.transform='translateY('+ev(a.brkTy,t)+'px)';

    el.brk.style.width=borderW+'px';
    el.brk.style.left=(-borderW/2)+'px';

    el.brkL.style.left='0px';
    el.brkR.style.left=(borderW-30)+'px';

    var bsc=ev(a.brkScale,t);
    var gA=ev(a.gA,t);

    var gcol=
      toS(ev(a.gR,t))+','+
      toS(ev(a.gG,t))+','+
      toS(ev(a.gB,t));

    var bf='drop-shadow(0 0 '+(6*bsc)+'px rgba(155,93,20,'+(0.9*gA)+'))';

    el.brkL.style.filter=el.brkR.style.filter=bf;

    el.centerGlow.style.background=
      'radial-gradient(ellipse at center, rgba('+gcol+','+
      (.30*gA)+') 0%, rgba(220,113,27,'+(.14*gA)+') 60%, transparent 100%)';

    var ws=ev(a.wonS,t);

    el.won.style.opacity=ev(a.wonOp,t);

    el.won.style.transform=
      'translate(-50%,-50%) translateY('+
      (CONFIG.wonY+ev(a.wonTy,t))+'px) scale('+ws+')';

    var ns=ev(a.nameS,t);
    var wh=ev(a.nameWhite,t);

    el.name.style.opacity=ev(a.nameOp,t);

    el.name.style.transform=
      'translate(-50%,-50%) translateY('+
      (CONFIG.nameY+ev(a.nameTy,t))+'px) scale('+ns+')';

    el.name.style.color=
      'rgb(255,'+
      Math.round(244+11*wh)+','+
      Math.round(105+150*wh)+')';
  }

  /* ===================================================================
     Playback & Sound
     =================================================================== */

  var t=0;
  var playing=false;
  var last=0;
  var speed=1;

  var scrub=$('scrub');
  var time=$('time');
  var play=$('play');

  var soundOn=true;
  var soundUnlocked=false;
  var preRollRemaining=0;

  var chest=$('sChest');

  var soundTracks=[
    {el:$('sBanner'),at:0,started:false}
  ];

  function stopSounds(){
    chest.pause();

    soundTracks.forEach(function(s){
      s.el.pause();
      s.started=false;
    });
  }

  function startChestSound(restart){
    if(!soundOn||!soundUnlocked) return;

    chest.playbackRate=speed;

    if(restart){
      try{chest.currentTime=0;}catch(e){}
    }

    chest.play().catch(function(){});
  }

  function startSoundsAt(pos){
    if(!soundOn||!soundUnlocked){
      stopSounds();
      return;
    }

    soundTracks.forEach(function(s){
      s.el.pause();
      s.started=false;
      s.el.playbackRate=speed;

      var offset=pos-s.at;

      if(offset>=0&&offset<s.el.duration){
        try{s.el.currentTime=offset;}catch(e){}

        s.started=true;

        s.el.play().catch(function(){
          s.started=false;
        });
      }else{
        try{s.el.currentTime=0;}catch(e){}
      }
    });
  }

  function updateSoundCues(pos){
    if(!soundOn||!soundUnlocked) return;

    soundTracks.forEach(function(s){
      if(!s.started&&pos>=s.at){
        try{s.el.currentTime=Math.max(0,pos-s.at);}catch(e){}

        s.el.playbackRate=speed;
        s.started=true;

        s.el.play().catch(function(){
          s.started=false;
        });
      }
    });
  }

  $('sound').addEventListener('click',function(){
    soundOn=!soundOn;

    $('sound').textContent='Som: '+(soundOn?'ligado':'desligado');

    $('sound').setAttribute('aria-pressed',String(soundOn));

    if(!soundOn){
      stopSounds();
    }else if(playing){
      soundUnlocked=true;

      if(preRollRemaining>0){
        startChestSound(false);
      }else{
        startSoundsAt(t);
      }
    }
  });

  function setT(v){
    t=Math.max(0,Math.min(cur.dur,v));

    render(t);

    scrub.value=Math.round(t/cur.dur*1000);

    time.textContent=
      t.toFixed(2)+' / '+cur.dur.toFixed(2)+' s';
  }

  function tick(ts){
    if(!playing) return;

    if(!last) last=ts;

    var dt=(ts-last)/1000*speed;

    last=ts;

    if(preRollRemaining>0){
      preRollRemaining=Math.max(0,preRollRemaining-dt);

      play.textContent='Abrindo baú...';

      if(preRollRemaining>0){
        requestAnimationFrame(tick);
        return;
      }

      setT(0);

      play.textContent='Pausar';

      last=ts;

      requestAnimationFrame(tick);

      return;
    }

    setT(t+dt);

    updateSoundCues(t);

    if(t>=cur.dur){
      playing=false;
      play.textContent='Tocar de novo';
      return;
    }

    requestAnimationFrame(tick);
  }

  function start(from,allowSound){
    var resumePreRoll=preRollRemaining>0;

    setT(from||0);

    playing=true;
    last=0;

    if(allowSound){
      soundUnlocked=true;

      if((from||0)<=.001){
        if(!resumePreRoll){
          preRollRemaining=2.5;
          startChestSound(true);
        }else{
          startChestSound(false);
        }

        startSoundsAt(-1);

        play.textContent='Abrindo baú...';
      }else{
        preRollRemaining=0;
        startSoundsAt(t);
        play.textContent='Pausar';
      }
    }else{
      preRollRemaining=0;
      stopSounds();
      play.textContent='Pausar';
    }

    requestAnimationFrame(tick);
  }

  play.addEventListener('click',function(){
    if(playing){
      playing=false;
      play.textContent='Continuar';
      stopSounds();
      return;
    }

    start(t>=cur.dur-.01?0:t,true);
  });

  scrub.addEventListener('input',function(){
    playing=false;
    play.textContent='Continuar';
    stopSounds();
    setT(scrub.value/1000*cur.dur);
  });

  document.addEventListener('keydown',function(e){
    if(e.code==='Space'||e.key===' '){
      if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;

      e.preventDefault();
      play.click();
    }
  });

  /* ===================================================================
     Escala do palco
     =================================================================== */

  var stage=$('stage');

  function fit(){
    var w=view.clientWidth;
    var h=view.clientHeight;

    var scale=Math.min(w/1920,h/1080);

    stage.style.transform=
      'translate(-50%,-50%) scale('+scale+')';
  }

  window.addEventListener('resize',fit);

  document.addEventListener('fullscreenchange',function(){
    fit();

    $('fullscreen').textContent=
      document.fullscreenElement?'Sair da tela cheia':'Tela cheia';
  });

  fit();

  $('fullscreen').addEventListener('click',function(){
    if(!document.fullscreenElement){
      if(view.requestFullscreen){
        view.requestFullscreen().catch(function(){});
      }
    }else if(document.exitFullscreen){
      document.exitFullscreen();
    }
  });

  /* ===================================================================
     GRAVAÇÃO DA ANIMAÇÃO
     Captura a área da prévia + áudio original.
     =================================================================== */

  var recordBtn=$('record');
  var recording=false;

  async function recordAnimation(){

    if(recording) return;

    if(!window.MediaRecorder){
      alert('Seu navegador não suporta gravação de vídeo.');
      return;
    }

    if(!HTMLCanvasElement.prototype.captureStream){
      alert('Seu navegador não suporta captura de vídeo.');
      return;
    }

    if(!window.html2canvas){
      alert('Não foi possível carregar a biblioteca de captura. Verifique sua conexão com a internet.');
      return;
    }

    if(!window.AudioContext&&!window.webkitAudioContext){
      alert('Seu navegador não suporta captura de áudio.');
      return;
    }

    recording=true;

    recordBtn.disabled=true;
    recordBtn.textContent='Preparando...';

    var wasPlaying=playing;
    var oldT=t;
    var oldSound=soundOn;

    try{

      // Contexto de áudio para juntar os sons da animação.
      var AudioCtx=window.AudioContext||window.webkitAudioContext;

      var audioCtx=new AudioCtx();

      await audioCtx.resume();

      var audioDestination=audioCtx.createMediaStreamDestination();

      var audioElements=[chest,$('sBanner')];

      var audioSources=[];

      audioElements.forEach(function(audio){

        var source=audioCtx.createMediaElementSource(audio);

        var gain=audioCtx.createGain();

        gain.gain.value=1;

        source.connect(gain);

        gain.connect(audioCtx.destination);
        gain.connect(audioDestination);

        audioSources.push(source);
      });

      // Canvas exclusivo para gravar somente a prévia.
      var captureCanvas=document.createElement('canvas');

      captureCanvas.width=Math.max(640,view.clientWidth);
      captureCanvas.height=Math.round(
        captureCanvas.width*9/16
      );

      var captureCtx=captureCanvas.getContext('2d');

      var videoStream=captureCanvas.captureStream(30);

      var audioTracks=audioDestination.stream.getAudioTracks();

      audioTracks.forEach(function(track){
        videoStream.addTrack(track);
      });

      // Escolha automática do formato.
      var mimeType='';

      var formats=[
        'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
        'video/mp4',
        'video/webm;codecs=vp9,opus',
        'video/webm;codecs=vp8,opus',
        'video/webm'
      ];

      for(var i=0;i<formats.length;i++){
        if(MediaRecorder.isTypeSupported(formats[i])){
          mimeType=formats[i];
          break;
        }
      }

      if(!mimeType){
        throw new Error('Nenhum formato de gravação compatível foi encontrado.');
      }

      var recorder=new MediaRecorder(videoStream,{
        mimeType:mimeType,
        videoBitsPerSecond:12000000,
        audioBitsPerSecond:192000
      });

      var chunks=[];

      recorder.ondataavailable=function(e){
        if(e.data&&e.data.size>0){
          chunks.push(e.data);
        }
      };

      var stopped=new Promise(function(resolve,reject){

        recorder.onstop=resolve;

        recorder.onerror=function(e){
          reject(e.error||new Error('Erro durante a gravação.'));
        };

      });

      function drawFrame(){

        return html2canvas(view,{
          backgroundColor:null,
          scale:1,
          logging:false,
          useCORS:true
        }).then(function(canvas){

          captureCtx.clearRect(
            0,0,captureCanvas.width,captureCanvas.height
          );

          captureCtx.drawImage(
            canvas,
            0,0,
            captureCanvas.width,
            captureCanvas.height
          );

        });

      }

      // Para qualquer reprodução anterior.
      playing=false;
      stopSounds();

      if(!oldSound){
        // A gravação respeita a opção de som desligado.
        soundOn=false;
      }else{
        soundOn=true;
      }

      setT(0);

      await drawFrame();

      recorder.start(100);

      recordBtn.textContent='Gravando...';

      // Inicia a animação original, incluindo o pré-roll do baú.
      start(0,true);

      // Captura contínua dos frames.
      while(playing||preRollRemaining>0){

        await drawFrame();

        await new Promise(function(resolve){
          setTimeout(resolve,33);
        });

      }

      // Captura o último frame.
      await drawFrame();

      recorder.stop();

      await stopped;

      // Libera as faixas.
      videoStream.getTracks().forEach(function(track){
        track.stop();
      });

      audioDestination.stream.getTracks().forEach(function(track){
        track.stop();
      });

      await audioCtx.close();

      var blob=new Blob(chunks,{
        type:mimeType
      });

      var isMp4=mimeType.indexOf('mp4')!==-1;

      var extension=isMp4?'mp4':'webm';

      var url=URL.createObjectURL(blob);

      var link=document.createElement('a');

      link.href=url;

      link.download='Fortnite_Reward_Won.'+extension;

      document.body.appendChild(link);

      link.click();

      link.remove();

      setTimeout(function(){
        URL.revokeObjectURL(url);
      },10000);

      alert(
        isMp4
        ? 'Gravação concluída! O vídeo foi salvo em MP4.'
        : 'Gravação concluída! Seu navegador não oferece gravação MP4 pelo MediaRecorder, então o vídeo foi salvo em WebM.'
      );

      // Restaura a reprodução anterior.
      soundOn=oldSound;

      if(!oldSound){
        stopSounds();
      }

      if(wasPlaying){
        start(oldT,true);
      }else{
        playing=false;
        setT(oldT);
        play.textContent='Continuar';
      }

    }catch(error){

      console.error('Erro na gravação:',error);

      alert(
        'Não foi possível gravar a animação: '+
        (error.message||error)
      );

      playing=false;
      stopSounds();

      setT(oldT);

      soundOn=oldSound;

      play.textContent='Continuar';

    }finally{

      recording=false;

      recordBtn.disabled=false;
      recordBtn.textContent='Gravar animação';

    }

  }

  recordBtn.addEventListener('click',recordAnimation);

  /* ===================================================================
     Fontes
     =================================================================== */

  if(document.fonts&&document.fonts.load){
    document.fonts.load("900 48px 'Burbank Big Condensed'").then(function(){
      render(t);
    });
  }

  /* ===================================================================
     Visualização inicial
     =================================================================== */

  setT(3.6);

  var reduce=
    window.matchMedia&&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if(!reduce){
    setTimeout(function(){
      start(0,false);
    },600);
  }

})();
</script>

</body>
</html>
