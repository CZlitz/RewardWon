:root{
  --bg:#080808;

  --fg:#f2f2f2;
  --muted:#a0a0a0;
  --line:#292929;
  --accent:#f2b933;

  --display:'Burbank Big Regular Black',Impact,sans-serif;

  color-scheme:dark;
}

*{box-sizing:border-box;}

body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--fg);
  font-family:var(--body);
  font-size:15px;
  line-height:1.5;
  user-select:none;
  -webkit-user-select:none;
}

.wrap{
  max-width:1240px;
  margin:0 auto;
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;
  justify-content:center;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px 16px;
  box-shadow:0 4px 18px rgba(0,0,0,0.35);
}

button{
  font:600 14px var(--body);
  color:var(--fg);
  background:#191919;
  border:1px solid var(--line);
  border-radius:6px;
  padding:8px 15px;
  min-height:38px;
  cursor:pointer;
  transition:background .15s ease,transform .1s ease;
}

button:hover{background:#292929;}
button:active{transform:scale(0.97);}

button.primary{
  background:var(--accent);
  color:var(--accent-fg);
  border-color:var(--accent);
  font-weight:700;
}

button.primary:hover{background:#ffd04a;}

button:focus-visible{
  outline:3px solid var(--accent);
  outline-offset:2px;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.backgrounds{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:9px;
  padding-left:10px;
  border-left:1px solid var(--line);
  color:var(--muted);
  font-size:13px;
}

.backgrounds label{
  display:flex;
  align-items:center;
  gap:6px;
}

.backgrounds input[type="color"]{
  width:35px;
  height:32px;
  padding:2px;
  background:#191919;
  border:1px solid var(--line);
  border-radius:6px;
  cursor:pointer;
}

.backgrounds input[type="text"]{
  width:82px;
  min-height:32px;
  padding:5px 7px;
  color:var(--fg);
  background:#191919;
  border:1px solid var(--line);
  border-radius:6px;
  font:12px var(--display);
  text-transform:uppercase;
}

.backgrounds select{
  min-height:32px;
  padding:5px 8px;
  color:var(--fg);
  background:#191919;
  border:1px solid var(--line);
  border-radius:6px;
  font:12px var(--display);
  cursor:pointer;
}

.shortcut-hint{
  font-size:12px;
  color:var(--muted);
  margin-left:8px;
}

.shortcut-hint kbd{
  background:#222;
  border:1px solid var(--line);
  padding:2px 6px;
  border-radius:4px;
  color:var(--fg);

        ctx.globalAlpha=op*emergence*(.72+fallbackHash(j+33)*.28);
        var tone=.28+fallbackHash(j+71)*.48;
        ctx.fillStyle='rgb(255,'+Math.round(158+64*tone)+','+Math.round(20+56*tone)+')';
        ctx.shadowBlur=0;
        ctx.beginPath();
        var dj=.07+.62*Math.exp(-age*1.3);
        ctx.moveTo((fallbackHash(j+1)-.5)*dj*size,size*(-.62+(fallbackHash(j+2)-.5)*dj*1.3));
        ctx.lineTo(size*(-.52+(fallbackHash(j+3)-.5)*dj*1.4),size*(.36+(fallbackHash(j+4)-.5)*dj*1.3));
        ctx.lineTo(size*(.52+(fallbackHash(j+5)-.5)*dj*1.4),size*(.36+(fallbackHash(j+6)-.5)*dj*1.3));
        ctx.closePath();ctx.fill();
        ctx.restore();
      }
      ctx.restore();
    }

    var particlePulse=Math.max(0,Math.min(1,(t-1.52)/.09))*(1-Math.max(0,Math.min(1,(t-2.22)/.33)));
    if(particlePulse>.005){
      ctx.save();ctx.globalAlpha=op*particlePulse*.8;
      for(var k=0;k<32;k++){
        var a=fallbackHash(k+2)*Math.PI*2+t*(.10+fallbackHash(k+8)*.15);
        var r=(fallbackHash(k+4)*.78+t*(.035+fallbackHash(k+9)*.035))% .93;
        var px=cx+Math.cos(a)*r*400,py=cy+Math.sin(a)*r*400;
        ctx.fillStyle='#FFF1D3';ctx.beginPath();ctx.arc(px,py,.7+fallbackHash(k+1)*.6,0,Math.PI*2);ctx.fill();
      }
      ctx.restore();
    }
  }

  function render(t){
    var a=cur;
    el.introChest.style.opacity='0';
    el.ov.style.opacity=ev(a.rootOp,t);
    var cornerOp=ev(a.cornerSpeed,t);
    el.cornerSpeedLines.style.opacity=String(Math.min(1,cornerOp*6));animateEdgeRays(t,cornerOp);
    el.cornerSpeedLines.style.transform='none';
    var emberOp=ev(a.embersOp,t);
    el.embersCanvas.style.opacity=String(emberOp);
    drawEmbers(t,emberOp);
    var rOp=ev(a.raysOp,t);
    var rayScaleY=ev(a.raysSy,t);
    el.raysCanvas.style.opacity=rOp;
    el.raysCanvas.style.transform=
      'translateY('+ev(a.raysTy,t)+'px) scale(2,'+rayScaleY+')';
    renderRays(t,rOp);
    if(rayGL===null&&rayGLInitialized){
      el.raysFallback.style.display='block';
      el.raysFallback.style.opacity=String(rOp);
      el.raysFallback.style.transform=
        'translateY('+ev(a.raysTy,t)+'px) scale(2,'+rayScaleY+')';
      drawFallbackEffects(t,rOp);
    }else{
      el.raysFallback.style.opacity='0';
    }

    var bigVisible=(t>=1.6&&t<5.233);
    el.big.style.opacity=bigVisible?ev(a.bigOp,t):0;
    var bs=ev(a.bigS,t);
    el.big.style.transform=
      'translate('+ev(a.bigTx,t)+'px,'+CONFIG.bigY+'px) scale('+bs+')';
    var bigFill=Math.max(0,Math.min(1,(ev(a.fillBig,t)+.2)/1.2));
    el.bigTxt.style.opacity=String(bigFill);

    var vs=ev(a.vboxS,t);
    el.vbox.style.opacity=ev(a.vboxOp,t);
    el.vbox.style.transform=
      'translate('+ev(a.vboxTx,t)+'px,'+ev(a.vboxTy,t)+'px) scale('+vs+')';

    el.prize.style.transform='translateY('+ev(a.prizeTy,t)+'px)';

    var bgs=ev(a.bgS,t)*ev(a.bgScaleP,t);
    var glow=ev(a.bgGlow,t);
    el.bg.style.transform=
      'translate(0px,-8px) rotate('+CONFIG.plateRotate+'deg) scale('+bgs+')';
    el.bg.style.filter=
      'drop-shadow(0 0 '+(14+glow*4)+'px rgba(255,200,80,'+
      Math.min(.95,.35+glow*.1)+'))';

    var circVisible=t<2.367;
    var co=circVisible?ev(a.cAlpha,t):0;
    el.circ.style.opacity=co;
    el.cRing.style.display=co>.005?'block':'none';
    el.cFlare.style.display=co>.005?'block':'none';

    if(co>.005){
      var cs=ev(a.circS,t);
      el.circ.style.transform='scale('+cs+')';
      var rsz=Math.max(ev(a.cRingS,t),.001);
      var th=Math.max(2,Math.min(16,2+(ev(a.cRingT,t)+4)*2.2));
      el.cRing.style.transform='scale('+rsz+')';
      el.cRing.style.borderWidth=(th/Math.max(rsz,.3))+'px';
      el.cRing.style.opacity=ev(a.cRingA,t);

      var fl=ev(a.cFlare,t);
      el.cFlare.style.transform='scale('+(fl*1.2)+')';
      el.cFlare.style.opacity=Math.max(0,Math.min(1,ev(a.cFlareA,t)/2));
    }

    var rs=ev(a.rewardS,t);
    el.reward.style.opacity=ev(a.rewardOp,t);
    el.reward.style.transform=
      'translate(-50%,-50%) translateY('+ev(a.rewardTy,t)+'px) scale('+rs+')';

    var rr=ev(a.rowS,t);
    el.row.style.transform='translateY('+ev(a.rowTy,t)+'px) scale('+rr+')';

    var nameW=el.name.offsetWidth;
    var borderW=(Math.max(nameW,el.won.offsetWidth)+20)*ev(a.brkW,t);
    var sideCx=borderW/2+40+256;
    var fb=Math.max(0,Math.min(1,(ev(a.fillBig,t)+.2)/1.2));
    var gl=ev(a.glow,t);
    var sx=ev(a.sSx,t);
    var sideScale=sx*.86;

    var rLines=el.sideR.firstElementChild;
    var lLines=el.sideL.firstElementChild;
    var rightLine=rLines.firstElementChild;
    var leftLine=lLines.firstElementChild;
    leftLine.style.transform=rightLine.style.transform='scaleX('+fb+')';
    rightLine.style.filter=leftLine.style.filter=
      'drop-shadow(0 0 '+(3+gl*3)+'px rgba(255,184,54,.9)) '+
      'drop-shadow(0 0 '+(7+gl*5)+'px rgba(255,128,20,.62)) '+
      'drop-shadow(0 0 '+(13+gl*5)+'px rgba(255,105,0,.3))';
    rLines.style.transform='translateX(0px)';
    lLines.style.transform='translateX(0px)';

    el.sideR.style.transform=
      'translate('+(sideCx-79)+'px,0) scale('+sideScale+','+sideScale+')';
    el.sideL.style.transform=
      'translate('+(-sideCx+79)+'px,0) scale('+(-sideScale)+','+sideScale+')';

    el.brk.style.opacity=ev(a.brkOp,t);
    el.brk.style.transform='translateY('+ev(a.brkTy,t)+'px)';
    el.brk.style.width=borderW+'px';
    el.brk.style.left=(-borderW/2)+'px';
    el.brkTexR.style.left=(borderW-97)+'px';
    el.textBack.style.width=Math.max(0,borderW-90)+'px';
    el.textBack.style.opacity=String(Math.max(ev(a.brkOp,t),ev(a.nameOp,t))*.78);
    var thunderCenter=borderW/2-4;
    el.thunderL.style.left=(-thunderCenter-64)+'px';
    el.thunderR.style.left=(thunderCenter-64)+'px';
    el.thunderL.style.opacity=el.thunderR.style.opacity=String(ev(a.gA,t));

    var bsc=ev(a.brkScale,t);
    var gA=ev(a.gA,t);
    var gcol=toS(ev(a.gR,t))+','+toS(ev(a.gG,t))+','+toS(ev(a.gB,t));
    var bf='drop-shadow(0 0 '+(6*bsc)+'px rgba(155,93,20,'+(0.9*gA)+'))';
    el.brkTexL.style.filter=el.brkTexR.style.filter=bf+' drop-shadow(0 0 2px rgba(255,226,143,.86)) drop-shadow(0 0 7px rgba(255,139,17,.72)) drop-shadow(0 0 14px rgba(255,91,0,.32))';

    var ws=ev(a.wonS,t);
    el.won.style.opacity=ev(a.wonOp,t);
    el.won.style.transform=
      'translate(-50%,-50%) translateY('+(CONFIG.wonY+ev(a.wonTy,t))+'px) scale('+ws+')';

    var ns=ev(a.nameS,t);
    el.name.style.opacity=ev(a.nameOp,t);
    el.name.style.transform=
      'translate(-50%,-50%) translateY('+(CONFIG.nameY+ev(a.nameTy,t))+'px) scale('+ns+')';
    var nameGold=Math.max(0,Math.min(1,(t-2.24)/.28));
    var nameR=255,nameG=Math.round(255-(255-230)*nameGold),nameB=Math.round(255-(255-36)*nameGold);
    el.name.style.color='rgb('+nameR+','+nameG+','+nameB+')';
    el.name.style.textShadow='0 2px 3px rgba(0,0,0,.35)';
    var glowHot=1-nameGold;
    var glowG=Math.round(224+19*glowHot);
    var glowB=Math.round(91-33*glowHot);
    var glowCore=(.47+.35*glowHot).toFixed(3);
    var glowMid=(.27+.17*glowHot).toFixed(3);
    el.nameGlow.style.background=
      'radial-gradient(ellipse at center,rgba(255,'+glowG+','+glowB+','+glowCore+') 0%,'+
      'rgba(255,'+Math.round(190+35*glowHot)+','+Math.round(47+12*glowHot)+','+glowMid+') 36%,'+
      'rgba(255,166,24,.09) 64%,transparent 79%)';
    el.nameGlow.style.opacity=String(ev(a.nameOp,t)*.78);
    el.nameGlow.style.transform='translate(-50%,-50%) translateY('+(CONFIG.nameY+ev(a.nameTy,t)-8)+'px)';
    el.brkTexL.style.opacity=el.brkTexR.style.opacity=String(ev(a.gA,t));
  }

  var t=0;
  var playing=false;
  var last=0;
  var speed=1;
  var scrub=$('scrub');
  var time=$('time');
  var play=$('play');
  var soundOn=true;
  var soundUnlocked=false;
  var preRollRemaining=0;
  var chest=$('sChest');

  var soundTracks=[
    {el:$('sBanner'),at:0,started:false}
  ];

  function stopSounds(){
    chest.pause();
    soundTracks.forEach(function(s){
      s.el.pause();
      s.started=false;
    });
  }

  function startChestSound(restart){
    if(!soundOn||!soundUnlocked)return;
    chest.playbackRate=speed;
    if(restart){
      try{chest.currentTime=0;}catch(e){}
    }
    chest.play().catch(function(){});
  }

  function startSoundsAt(pos){
    if(!soundOn||!soundUnlocked){
      stopSounds();
      return;
    }
    soundTracks.forEach(function(s){
      s.el.pause();
      s.started=false;
      s.el.playbackRate=speed;
      var offset=pos-s.at;
      if(offset>=0&&offset<s.el.duration){
        try{s.el.currentTime=offset;}catch(e){}
        s.started=true;
        s.el.play().catch(function(){s.started=false;});
      }else{
        try{s.el.currentTime=0;}catch(e){}
      }
    });
  }

  function updateSoundCues(pos){
    if(!soundOn||!soundUnlocked)return;
    soundTracks.forEach(function(s){
      if(!s.started&&pos>=s.at){
        try{s.el.currentTime=Math.max(0,pos-s.at);}catch(e){}
        s.el.playbackRate=speed;
        s.started=true;
        s.el.play().catch(function(){s.started=false;});
      }
    });
  }

  $('sound').addEventListener('click',function(){
    soundOn=!soundOn;
    $('sound').textContent='Sound: '+(soundOn?'on':'off');
    $('sound').setAttribute('aria-pressed',String(soundOn));
    if(!soundOn){
      stopSounds();
    }else if(playing){
      soundUnlocked=true;
      if(preRollRemaining>0){
        startChestSound(false);
      }else{
        startSoundsAt(t);
      }
    }
  });

  function setT(v){
    t=Math.max(0,Math.min(cur.dur,v));
    render(t);
    scrub.value=Math.round(t/cur.dur*1000);
    time.textContent=t.toFixed(2)+' / '+cur.dur.toFixed(2)+' s';
  }

  function renderIntroChest(remaining){
    var elapsed=Math.max(0,Math.min(2.5,2.5-remaining));
    if(remaining<=0){
      el.introChest.style.opacity='0';
      el.ov.style.opacity=String(ev(cur.rootOp,0));
      return;
    }
    el.ov.style.opacity='1';
    var drop=Math.max(0,Math.min(1,(elapsed-1.8)/.7));
    var fade=elapsed<1.8?1:1-drop;
    var shake=1-drop;
    var x=Math.sin(elapsed*43)*5*shake;
    var y=Math.sin(elapsed*31)*3*shake+drop*150;
    var rot=Math.sin(elapsed*39)*1.8*shake+drop*5;
    var scale=1+Math.sin(elapsed*47)*.012*shake-.12*drop;
    el.introChest.style.opacity=String(fade);
    el.introChest.style.transform='translate(-50%,-50%) translate('+x+'px,'+y+'px) rotate('+rot+'deg) scale('+scale+')';
  }

  function tick(ts){
    if(!playing)return;
    if(!last)last=ts;
    var dt=(ts-last)/1000*speed;
    last=ts;

    if(preRollRemaining>0){
      preRollRemaining=Math.max(0,preRollRemaining-dt);
      play.textContent='Opening chest...';
      renderIntroChest(preRollRemaining);
      if(preRollRemaining>0){
        requestAnimationFrame(tick);
        return;
      }
      renderIntroChest(0);
      if(soundOn&&soundUnlocked)startSoundsAt(0);
      setT(0);
      play.textContent='Pause';
      last=ts;
      requestAnimationFrame(tick);
      return;
    }

    setT(t+dt);
    updateSoundCues(t);

    if(t>=cur.dur){
      playing=false;
      play.textContent='Play again';
      return;
    }
    requestAnimationFrame(tick);
  }

  function start(from,allowSound){
    var resumePreRoll=preRollRemaining>0;
    setT(from||0);
    playing=true;
    last=0;

    if((from||0)<=.001){
      if(!resumePreRoll)preRollRemaining=2.5;
      if(allowSound){
        soundUnlocked=true;
        startChestSound(!resumePreRoll);
        startSoundsAt(-1);
      }else{
        stopSounds();
      }
      renderIntroChest(preRollRemaining);
      play.textContent='Opening chest...';
    }else{
      preRollRemaining=0;
      renderIntroChest(0);
      if(allowSound){
        soundUnlocked=true;
        startSoundsAt(t);
      }else{
        stopSounds();
      }
      play.textContent='Pause';
    }
    requestAnimationFrame(tick);
  }

  play.addEventListener('click',function(){
    if(playing){
      playing=false;
      play.textContent='Resume';
      stopSounds();
      return;
    }
    start(t>=cur.dur-.01?0:t,true);
  });

  scrub.addEventListener('input',function(){
    playing=false;
    play.textContent='Resume';
    stopSounds();
    setT(scrub.value/1000*cur.dur);
  });

  document.addEventListener('keydown',function(e){
    if(e.code==='Space'||e.key===' '){
      if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
      e.preventDefault();
      play.click();
    }
  });

  document.addEventListener('keydown',function(e){
    if((e.key==='f'||e.key==='F'||e.code==='KeyF')&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
      var tg=e.target&&e.target.tagName;
      if(tg==='INPUT'||tg==='SELECT'||tg==='TEXTAREA')return;
      e.preventDefault();
      $('fullscreen').click();
    }
  });

  var stage=$('stage');

  function fit(){
    var w=view.clientWidth;
    var h=view.clientHeight;
    var scale=Math.min(w/1920,h/1080);
    stage.style.transform='translate(-50%,-50%) scale('+scale+')';
  }

  window.addEventListener('resize',fit);

  document.addEventListener('fullscreenchange',function(){
    fit();
    $('fullscreen').textContent=
      document.fullscreenElement?'Exit fullscreen':'Fullscreen';
  });

  fit();

  $('fullscreen').addEventListener('click',function(){
    if(!document.fullscreenElement){
      if(view.requestFullscreen){
        view.requestFullscreen().catch(function(){});
      }
    }else if(document.exitFullscreen){
      document.exitFullscreen();
    }
  });

  var recordBtn=$('record');
  var recording=false;

  async function recordAnimation(){
    if(recording)return;
    if(!window.MediaRecorder){
      alert('Your browser does not support video recording.');
      return;
    }
    if(!HTMLCanvasElement.prototype.captureStream){
      alert('Your browser does not support video capture.');
      return;
    }
    if(!window.html2canvas){
      alert('Could not load the capture library. Check your internet connection.');
      return;
    }
    if(!window.AudioContext&&!window.webkitAudioContext){
      alert('Your browser does not support audio capture.');
      return;
    }

    recording=true;
    recordBtn.disabled=true;
    recordBtn.textContent='Preparing...';

    var wasPlaying=playing;
    var oldT=t;
    var oldSound=soundOn;

    try{
      var AudioCtx=window.AudioContext||window.webkitAudioContext;
      var audioCtx=new AudioCtx();
      await audioCtx.resume();
      var audioDestination=audioCtx.createMediaStreamDestination();
      var audioElements=[chest,$('sBanner')];
      var audioSources=[];

      audioElements.forEach(function(audio){
        var source=audioCtx.createMediaElementSource(audio);
        var gain=audioCtx.createGain();
        gain.gain.value=1;
        source.connect(gain);
        gain.connect(audioCtx.destination);
        gain.connect(audioDestination);
        audioSources.push(source);
      });

      var captureCanvas=document.createElement('canvas');
      captureCanvas.width=Math.max(640,view.clientWidth);
      captureCanvas.height=Math.round(captureCanvas.width*9/16);
      var captureCtx=captureCanvas.getContext('2d');
      var videoStream=captureCanvas.captureStream(30);
      var audioTracks=audioDestination.stream.getAudioTracks();
      audioTracks.forEach(function(track){videoStream.addTrack(track);});

      var mimeType='';
      var formats=[
        'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
        'video/mp4',
        'video/webm;codecs=vp9,opus',
        'video/webm;codecs=vp8,opus',
        'video/webm'
      ];

      for(var i=0;i<formats.length;i++){
        if(MediaRecorder.isTypeSupported(formats[i])){
          mimeType=formats[i];
          break;
        }
      }

      if(!mimeType){
        throw new Error('No compatible recording format was found.');
      }

      var recorder=new MediaRecorder(videoStream,{
        mimeType:mimeType,
        videoBitsPerSecond:12000000,
        audioBitsPerSecond:192000
      });

      var chunks=[];
      recorder.ondataavailable=function(e){
        if(e.data&&e.data.size>0)chunks.push(e.data);
      };

      var stopped=new Promise(function(resolve,reject){
        recorder.onstop=resolve;
        recorder.onerror=function(e){
          reject(e.error||new Error('Recording error.'));
        };
      });

      function drawFrame(){
        return html2canvas(view,{
          backgroundColor:null,
          scale:1,
          logging:false,
          useCORS:true
        }).then(function(canvas){
          captureCtx.clearRect(0,0,captureCanvas.width,captureCanvas.height);
          captureCtx.drawImage(canvas,0,0,captureCanvas.width,captureCanvas.height);
        });
      }

      playing=false;
      stopSounds();
      soundOn=oldSound;
      setT(0);
      await drawFrame();
      recorder.start(100);
      recordBtn.textContent='Recording...';
      start(0,true);

      while(playing||preRollRemaining>0){
        await drawFrame();
        await new Promise(function(resolve){setTimeout(resolve,33);});
      }

      await drawFrame();
      recorder.stop();
      await stopped;

      videoStream.getTracks().forEach(function(track){track.stop();});
      audioDestination.stream.getTracks().forEach(function(track){track.stop();});
      await audioCtx.close();

      var blob=new Blob(chunks,{type:mimeType});
      var isMp4=mimeType.indexOf('mp4')!==-1;
      var extension=isMp4?'mp4':'webm';
      var url=URL.createObjectURL(blob);
      var link=document.createElement('a');
      link.href=url;
      link.download='Fortnite_Reward_Won.'+extension;
      document.body.appendChild(link);
      link.click();
      link.remove();

      setTimeout(function(){URL.revokeObjectURL(url);},10000);

      alert(
        isMp4
        ? 'Recording complete! The video was saved as MP4.'
        : 'Recording complete! Your browser does not support MP4 recording through MediaRecorder, so the video was saved as WebM.'
      );

      soundOn=oldSound;
      if(!oldSound)stopSounds();

      if(wasPlaying){
        start(oldT,true);
      }else{
        playing=false;
        setT(oldT);
        play.textContent='Resume';
      }

    }catch(error){
      console.error('Recording error:',error);
      alert('Could not record the animation: '+(error.message||error));
      playing=false;
      stopSounds();
      setT(oldT);
      soundOn=oldSound;
      play.textContent='Resume';

    }finally{
      recording=false;
      recordBtn.disabled=false;
      recordBtn.textContent='Record animation';
    }
  }

  recordBtn.addEventListener('click',recordAnimation);

  if(document.fonts&&document.fonts.load){
    document.fonts.load("900 48px 'Burbank Big Regular Black'").then(function(){
      render(t);
    });
  }
  setTimeout(initRayGL,0);
  setT(0);
})();
</script>
